name: Generate badges

permissions:
  contents: write

on:
  push:
    branches: [main]

jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Git
        run: |
          git config --global user.name 'Groupings Project'
          git config --global user.email 'actions@noreply.its.hawaii.edu'

      - name: Create the badges branch if it doesn't exist
        run: |
          branch_name="badges"
          if ! git ls-remote --exit-code origin refs/heads/$branch_name; then
            echo "Branch $branch_name does not exist. Creating it..."
            git checkout --orphan $branch_name
            git rm -rf .
            git commit --allow-empty -m "Create $branch_name branch"
            git push -u origin $branch_name
          else
            echo "Branch $branch_name already exists."
          fi

  generate-badges:
    needs: create-branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Pin npm 11.10.0 so ui/.npmrc (ignore-scripts, min-release-age) applies in CI.
      - name: Verify Node supports npm 11
        run: |
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 24) { console.error('ui/.nvmrc must pin Node >= 24'); process.exit(1); }"

      - name: Install npm
        run: npm install -g npm@11.10.0

      - name: Verify npm version
        run: npm --version

      - name: Installing dependencies
        working-directory: ui
        run: npm ci

      - name: Tests
        working-directory: ui
        run: npm run test:coverage

      - name: Switch to badges branch
        run: |
          git fetch
          git switch badges

      - name: Generating coverage badges
        uses: jpb06/coverage-badges-action@6bebba3f008cb03c2be0ff9b148c663df30cde4b # v1.4.11
        with:
          branches: "*"
          coverage-summary-path: ui/coverage/coverage-summary.json
          no-commit: true
          target-branch: badges

      - name: Commit and push badges
        run: |
          cd badges
          if [[ `git status --porcelain *.svg` ]]; then
            git config --global user.name 'Groupings Project'
            git config --global user.email 'actions@noreply.its.hawaii.edu'
            git add *.svg
            git commit -m "Autogenerated Vitest badges" *.svg
            git push origin badges -f
          fi
