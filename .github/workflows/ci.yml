name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vitest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Pin npm 11.10.0 so ui/.npmrc (ignore-scripts, min-release-age) applies in CI.
      - name: Verify Node supports npm 11
        run: |
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 24) { console.error('ui/.nvmrc must pin Node >= 24'); process.exit(1); }"

      - name: Install npm
        run: npm install -g npm@11.10.0

      - name: Verify npm version
        run: npm --version

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Run ESLint
        working-directory: ui
        run: npm run lint

      - name: Run Vitest Tests
        working-directory: ui
        run: npm run test
